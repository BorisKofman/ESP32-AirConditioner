name: Build ESP32 Project with Custom Libraries

on:
  push:
    # branches:
    #   - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Install ESP32 Board Package
      run: |
        arduino-cli core update-index
        arduino-cli core install esp32:esp32

    - name: Clone HomeSpan (Ethernet Branch) and IRremoteESP8266
      run: |
        mkdir -p libraries
        git clone --branch ethernet https://github.com/HomeSpan/HomeSpan.git libraries/HomeSpan
        git clone https://github.com/BorisKofman/IRremoteESP8266.git libraries/IRremoteESP8266

    - name: Compile Sketch
      run: |
        ls -la 
        arduino-cli compile --fqbn esp32:esp32:esp32s3 ESP32-AirConditioner/ESP32-AirConditioner.ino
      env:
        ARDUINO_LIBRARY_PATH: libraries